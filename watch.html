<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watching Movie...</title>
    <link rel="icon" type="image/jpeg" href="image.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; overflow: hidden;
        }
        
        .back-btn {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: #ff1a1a; color: #fff; border: none; padding: 10px 20px;
            font-family: 'Montserrat', sans-serif; font-weight: 800; border-radius: 8px; 
            cursor: pointer; text-decoration: none; opacity: 0.8; transition: 0.3s;
            box-shadow: 0 0 10px rgba(255, 26, 26, 0.5);
        }
        .back-btn:hover {
            opacity: 1; box-shadow: 0 0 20px #ff1a1a;
        }

        iframe {
            width: 100%; height: 100%; border: none; 
            position: absolute; top: 0; left: 0; z-index: 1;
        }

        /* The Invisible Ad Shield */
        #ad-shield {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999; cursor: pointer;
        }
    </style>
</head>
<body>
    
    <a href="index.html" class="back-btn">⬅ Back to Home</a>
    
    <!-- This invisible layer absorbs the first click, triggers the ad, then deletes itself -->
    <div id="ad-shield" onclick="this.remove();"></div>
    
    <div id="video-wrapper"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tmdbId = urlParams.get('id');
        
        if (tmdbId) {
            const streamUrl = `https://vidsrc.me/embed/movie?tmdb=${tmdbId}`;
            
            document.getElementById('video-wrapper').innerHTML = `<iframe src="${streamUrl}" width="100%" height="100%" frameborder="0" scrolling="no" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>`;
        } else {
            document.getElementById('video-wrapper').innerHTML = '<h2 style="color:red; text-align:center; margin-top:20%; font-family:sans-serif;">Error: Could not load video.</h2>';
        }
    </script>

    <!-- Your Ad Scripts -->

    <script>(function(s){s.dataset.zone='11842006',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
</body>
</html>
